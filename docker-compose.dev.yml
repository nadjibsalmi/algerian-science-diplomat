services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      XDEBUG_MODE: develop,debug
      XDEBUG_CONFIG: "client_host=host.docker.internal"

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  meilisearch:
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  mailpit:
    ports:
      - "1025:1025"
      - "8025:8025"

  reverb:
    ports:
      - "8080:8080"

  telescope:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    container_name: asd_telescope
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    networks:
      - asd_network
