name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: PHP and frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for lockfiles (warning only)
        run: |
          if [ ! -f composer.lock ]; then
            echo "::warning file=composer.lock::composer.lock is missing in the repository. Generate and commit it from a controlled environment."
          fi
          if [ ! -f pnpm-lock.yaml ] && [ ! -f package-lock.json ]; then
            echo "::warning ::No frontend lockfile (pnpm-lock.yaml or package-lock.json) found. Commit a lockfile for reproducible installs."
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish --strict

      - name: Check PHP syntax
        shell: bash
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate and commit lockfiles (composer & pnpm)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          # Install PHP deps to generate composer.lock if missing
          # Update composer lock to match composer.json without installing packages
          composer update --lock --no-interaction || true
          # Create pnpm lockfile for workspace (monorepo)
          pnpm -w install --lockfile-only || true
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add composer.lock pnpm-lock.yaml || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): add generated lockfiles" || true
            # Push back to head branch (GITHUB_HEAD_REF is set in PR workflow)
            if [ -n "$GITHUB_HEAD_REF" ]; then
              git push origin HEAD:refs/heads/$GITHUB_HEAD_REF
            else
              git push
            fi
          else
            echo "No lockfile changes"
          fi

      - name: Composer audit
        run: composer audit || true

      - name: Frontend audit
        run: pnpm audit --json || true

      - name: Typecheck frontend
        run: pnpm --filter @workspace/asd-frontend run type-check
